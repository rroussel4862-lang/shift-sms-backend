name: Tests

on:
  pull_request:
  push:
    branches: [main]

# One run at a time: the tests wipe the test database, so two runs must never overlap.
concurrency:
  group: tests-database
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The ONLY real value: the dedicated Neon TEST database, stored as a GitHub secret.
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          # Everything below is a harmless placeholder (Twilio and the AI are mocked in tests).
          ALLOW_TEST_DB_WIPE: "true"
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test
          TWILIO_PHONE_NUMBER: "+15145550000"
          JWT_SECRET: ci-test-secret
          ANTHROPIC_API_KEY: ""
          PLATFORM_SETUP_KEY: ""
          ALLOWED_ORIGINS: http://localhost:3000
          PUBLIC_URL: http://localhost:3000
          COOKIE_SECURE: "false"
