name: Tests

on:
  pull_request:
    # Pull requests that ONLY change these files skip the tests (nothing there can affect them).
    # Anything else, including every .html page (a few tests read them), still runs the tests.
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "public/*.css"
  push:
    branches: [main] # always runs after a merge, as the safety net

# A newer push to the same branch replaces an older, still-running test.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database that lives next to the tests and disappears afterwards.
    # Much faster than a remote one, and nothing real is ever touched (no secret needed).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The throwaway database above (not Neon).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          DATABASE_SSL: "false"
          # Everything below is a harmless placeholder (Twilio and the AI are mocked in tests).
          ALLOW_TEST_DB_WIPE: "true"
          TWILIO_ACCOUNT_SID: ACtest
          TWILIO_AUTH_TOKEN: test
          TWILIO_PHONE_NUMBER: "+15145550000"
          JWT_SECRET: ci-test-secret
          ANTHROPIC_API_KEY: ""
          PLATFORM_SETUP_KEY: ""
          ALLOWED_ORIGINS: http://localhost:3000
          PUBLIC_URL: http://localhost:3000
          COOKIE_SECURE: "false"
