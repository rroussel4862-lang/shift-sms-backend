<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Platform Dashboard — Open Shift Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #14171A; --panel: #1C2024; --panel-light: #242830; --rail: #353B42;
    --text-bright: #EDEFF2; --text-dim: #8992A0;
    --green: #4FA37A; --amber: #E2A33B; --red: #D85C4A; --blue: #5B8BD6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-bright); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-family: 'IBM Plex Mono', monospace; }
  h1, h2 { font-family: 'Oswald', sans-serif; }

  #authGate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--rail); border-radius: 10px; padding: 26px; }
  .auth-card h1 { font-size: 20px; text-transform: uppercase; margin: 0 0 4px; }
  .auth-card .sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .auth-tab-btn { flex: 1; background: var(--panel-light); border: 1px solid var(--rail); color: var(--text-dim); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 11.5px; text-transform: uppercase; padding: 8px; border-radius: 6px; cursor: pointer; }
  .auth-tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 10px 0 5px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--rail); color: var(--text-bright); border-radius: 5px; padding: 9px 11px; font-family: inherit; font-size: 13.5px; }
  .auth-btn { width: 100%; margin-top: 16px; padding: 11px; background: var(--blue); color: #fff; border: none; border-radius: 6px; font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; font-size: 13px; cursor: pointer; }
  #authError { color: var(--amber); font-size: 12px; margin-top: 10px; min-height: 14px; }

  #app { display: none; }
  header { background: var(--panel); border-bottom: 1px solid var(--rail); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 16px; margin: 0; text-transform: uppercase; letter-spacing: 0.02em; }
  header .sub { color: var(--text-dim); font-size: 11px; }
  #logoutBtn { background: none; border: 1px solid var(--rail); color: var(--text-dim); font-size: 11px; text-transform: uppercase; padding: 6px 11px; border-radius: 4px; cursor: pointer; }

  main { padding: 22px; max-width: 1200px; margin: 0 auto; }
  .section { margin-bottom: 26px; }
  .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin: 0 0 12px; }

  .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .health-card { background: var(--panel); border: 1px solid var(--rail); border-radius: 8px; padding: 14px 16px; }
  .health-card .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 6px; }
  .health-card .value { font-size: 22px; font-weight: 600; }
  .health-card .value.ok { color: var(--green); }
  .health-card .value.warn { color: var(--amber); }
  .health-card .value.bad { color: var(--red); }
  .health-card .detail { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rail); border-radius: 8px; overflow: hidden; }
  thead th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); padding: 9px 12px; border-bottom: 1px solid var(--rail); }
  tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--rail); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-light); cursor: pointer; }
  .restaurant-name { font-weight: 600; }
  .pill { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 10px; background: var(--panel-light); color: var(--text-dim); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { background: var(--panel); border: 1px solid var(--rail); color: var(--text-bright); border-radius: 5px; padding: 7px 10px; font-size: 12.5px; font-family: inherit; }
  .filter-row button.ghost { background: none; border: 1px solid var(--rail); color: var(--text-dim); border-radius: 5px; padding: 7px 12px; font-size: 12px; cursor: pointer; }

  .activity-feed { background: var(--panel); border: 1px solid var(--rail); border-radius: 8px; max-height: 480px; overflow-y: auto; }
  .activity-row { display: flex; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--rail); font-size: 12.5px; align-items: baseline; }
  .activity-row:last-child { border-bottom: none; }
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .activity-dot.info { background: var(--text-dim); }
  .activity-dot.warn { background: var(--amber); }
  .activity-dot.error { background: var(--red); }
  .activity-time { color: var(--text-dim); font-size: 11px; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; }
  .activity-restaurant { color: var(--blue); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .activity-detail { flex: 1; min-width: 0; word-break: break-word; }
  .activity-type { color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 16px; text-align: center; }
</style>
</head>
<body>

<div id="authGate">
  <div class="auth-card">
    <h1>Platform Dashboard</h1>
    <div class="sub">Owner/dev view across every restaurant.</div>
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabLogin" onclick="setAuthMode('login')">Log in</button>
      <button class="auth-tab-btn" id="tabSignup" onclick="setAuthMode('signup')">First-time setup</button>
    </div>
    <div id="setupKeyField" style="display:none">
      <label>Setup key</label>
      <input type="text" id="setupKey" placeholder="PLATFORM_SETUP_KEY value" />
    </div>
    <label>Email</label>
    <input type="text" id="authEmail" placeholder="you@example.com" />
    <label>Password</label>
    <input type="password" id="authPassword" placeholder="••••••••" />
    <button class="auth-btn" id="authSubmitBtn" onclick="submitAuth()">Log in</button>
    <div id="authError"></div>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <h1>Platform Dashboard</h1>
      <div class="sub" id="headerSub"></div>
    </div>
    <button id="logoutBtn" onclick="logout()">Log out</button>
  </header>

  <main>
    <div class="section">
      <h2>System health</h2>
      <div class="health-grid" id="healthGrid"></div>
    </div>

    <div class="section">
      <h2>Restaurants</h2>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Staff</th><th>Shifts (open)</th><th>Open postings</th><th>Activity (7d)</th><th>Last activity</th><th>Signed up</th>
            </tr>
          </thead>
          <tbody id="restaurantsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2>Live activity</h2>
      <div class="filter-row">
        <select id="filterRestaurant" onchange="loadActivity()"><option value="">All restaurants</option></select>
        <select id="filterLevel" onchange="loadActivity()">
          <option value="">All levels</option>
          <option value="info">Info</option>
          <option value="warn">Warning</option>
          <option value="error">Error</option>
        </select>
        <button class="ghost" onclick="loadActivity()">Refresh</button>
      </div>
      <div class="activity-feed" id="activityFeed"></div>
    </div>
  </main>
</div>

<script>
let authMode = "login";
let restaurants = [];

function setAuthMode(mode) {
  authMode = mode;
  document.getElementById("tabLogin").classList.toggle("active", mode === "login");
  document.getElementById("tabSignup").classList.toggle("active", mode === "signup");
  document.getElementById("setupKeyField").style.display = mode === "signup" ? "block" : "none";
  document.getElementById("authSubmitBtn").textContent = mode === "signup" ? "Create account" : "Log in";
  document.getElementById("authError").textContent = "";
}

async function api(path, options) {
  try {
    const res = await fetch(path, { headers: { "Content-Type": "application/json" }, credentials: "same-origin", ...options });
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) return { ok: false, error: (body && body.error) || `HTTP ${res.status}` };
    return { ok: true, data: body };
  } catch (e) {
    return { ok: false, error: "Network error — is the server running?" };
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

async function submitAuth() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const errorDiv = document.getElementById("authError");
  errorDiv.textContent = "";
  if (!email || !password) { errorDiv.textContent = "Enter email and password"; return; }

  if (authMode === "signup") {
    const setupKey = document.getElementById("setupKey").value.trim();
    if (!setupKey) { errorDiv.textContent = "Enter the setup key"; return; }
    if (password.length < 8) { errorDiv.textContent = "Password must be at least 8 characters"; return; }
    const result = await api("/api/platform-auth/signup", { method: "POST", body: JSON.stringify({ email, password, setupKey }) });
    if (!result.ok) { errorDiv.textContent = result.error; return; }
    enterApp(result.data.email);
  } else {
    const result = await api("/api/platform-auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    if (!result.ok) { errorDiv.textContent = result.error; return; }
    enterApp(result.data.email);
  }
}

async function logout() {
  await api("/api/platform-auth/logout", { method: "POST" });
  location.reload();
}

function enterApp(email) {
  document.getElementById("authGate").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("headerSub").textContent = email;
  loadAll();
  setInterval(loadAll, 15000);
}

async function loadAll() {
  await Promise.all([loadRestaurants(), loadHealth(), loadActivity()]);
}

function timeAgo(ts) {
  if (!ts) return "—";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function formatDate(ts) {
  return new Date(ts).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

async function loadRestaurants() {
  const result = await api("/api/platform/restaurants");
  if (!result.ok) return;
  restaurants = result.data;

  const filterSel = document.getElementById("filterRestaurant");
  const currentVal = filterSel.value;
  filterSel.innerHTML = '<option value="">All restaurants</option>' + restaurants.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join("");
  filterSel.value = currentVal;

  const body = document.getElementById("restaurantsBody");
  body.innerHTML = restaurants.length === 0
    ? `<tr><td colspan="7" class="empty">No restaurants signed up yet.</td></tr>`
    : restaurants.map(r => `
        <tr onclick="document.getElementById('filterRestaurant').value='${r.id}'; loadActivity();">
          <td class="restaurant-name">${escapeHtml(r.name)}</td>
          <td class="num">${r.staffCount}</td>
          <td class="num">${r.shiftCount} <span style="color:var(--text-dim)">(${r.openShiftCount} open)</span></td>
          <td class="num">${r.openPostingCount}</td>
          <td class="num">${r.activityLast7d}</td>
          <td>${timeAgo(r.lastActivityAt)}</td>
          <td>${formatDate(r.createdAt)}</td>
        </tr>
      `).join("");
}

async function loadHealth() {
  const result = await api("/api/platform/health");
  const grid = document.getElementById("healthGrid");
  if (!result.ok) {
    grid.innerHTML = `<div class="health-card"><div class="label">Error</div><div class="value bad">${escapeHtml(result.error)}</div></div>`;
    return;
  }
  const h = result.data;
  const dbCls = !h.database.ok ? "bad" : h.database.latencyMs > 300 ? "warn" : "ok";
  const smsCls = h.sms.failedLastHour > 0 ? (h.sms.failedLastHour > h.sms.sentLastHour ? "bad" : "warn") : "ok";
  const aiCls = h.ai.failedLastHour > 0 ? (h.ai.failedLastHour > h.ai.answeredLastHour ? "bad" : "warn") : "ok";
  const totalErrors = h.errorsLastHour.reduce((sum, e) => sum + e.count, 0);
  const errCls = totalErrors === 0 ? "ok" : totalErrors < 5 ? "warn" : "bad";

  grid.innerHTML = `
    <div class="health-card">
      <div class="label">Database</div>
      <div class="value ${dbCls}">${h.database.ok ? h.database.latencyMs + "ms" : "DOWN"}</div>
      <div class="detail">Connection ${h.database.ok ? "healthy" : "failing"}</div>
    </div>
    <div class="health-card">
      <div class="label">SMS (last hour)</div>
      <div class="value ${smsCls}">${h.sms.sentLastHour} sent</div>
      <div class="detail">${h.sms.failedLastHour} failed${h.sms.avgLatencyMs ? ` · avg ${h.sms.avgLatencyMs}ms` : ""}</div>
    </div>
    <div class="health-card">
      <div class="label">AI agent (last hour)</div>
      <div class="value ${aiCls}">${h.ai.answeredLastHour} answered</div>
      <div class="detail">${h.ai.failedLastHour} failed${h.ai.avgLatencyMs ? ` · avg ${h.ai.avgLatencyMs}ms` : ""}</div>
    </div>
    <div class="health-card">
      <div class="label">Errors (last hour)</div>
      <div class="value ${errCls}">${totalErrors}</div>
      <div class="detail">${h.errorsLastHour.length === 0 ? "None" : h.errorsLastHour.map(e => `${e.eventType}: ${e.count}`).join(", ")}</div>
    </div>
  `;
}

async function loadActivity() {
  const restaurantId = document.getElementById("filterRestaurant").value;
  const level = document.getElementById("filterLevel").value;
  const params = new URLSearchParams();
  if (restaurantId) params.set("restaurantId", restaurantId);
  if (level) params.set("level", level);
  params.set("limit", "150");

  const result = await api(`/api/platform/activity?${params.toString()}`);
  const feed = document.getElementById("activityFeed");
  if (!result.ok) { feed.innerHTML = `<div class="empty">${escapeHtml(result.error)}</div>`; return; }
  const entries = result.data;
  feed.innerHTML = entries.length === 0
    ? `<div class="empty">No activity recorded yet.</div>`
    : entries.map(e => `
        <div class="activity-row">
          <div class="activity-dot ${e.level}"></div>
          <div class="activity-time">${new Date(e.createdAt).toLocaleTimeString()}</div>
          <div class="activity-restaurant">${escapeHtml(e.restaurantName)}</div>
          <div class="activity-detail">
            <span class="activity-type">${escapeHtml(e.eventType)}</span> — ${escapeHtml(e.detail)}${e.durationMs !== null && e.durationMs !== undefined ? ` <span class="num" style="color:var(--text-dim)">(${e.durationMs}ms)</span>` : ""}
          </div>
        </div>
      `).join("");
}

(async function checkSession() {
  const result = await api("/api/platform-auth/me");
  if (result.ok) enterApp(result.data.email);
})();
</script>
</body>
</html>
