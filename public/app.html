<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Open Shift Rail</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1C201D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Shift">
<link rel="manifest" href="/manifest-manager.json">
<link rel="stylesheet" href="/theme-clean.css">
<link rel="stylesheet" href="/theme-warm.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #sidebar { flex: none; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg, #F6F0E6); visibility: hidden; }
  #stage iframe.on { visibility: visible; }
  #demoBar { display: none; flex: none; background: #161B22; color: #F3F4F6; font: 600 12px/1.3 system-ui, sans-serif; text-align: center; padding: 6px 10px; }
</style>
</head>
<body class="theme-clean theme-warm shell">
<nav id="sidebar"></nav>
<div id="stage">
  <iframe id="fMi" title="Open Shift Rail"></iframe>
  <iframe id="fBo" title="Back Office"></iframe>
</div>
<div id="demoBar"></div>
<script src="/billing-gate.js"></script>
<script src="/app-shell.js"></script>
</body>
</html>
