<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open Shift Rail — Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1C201D;
    --panel: #262B27;
    --panel-light: #2E332E;
    --paper: #F0EAD8;
    --ink: #23261F;
    --amber: #E2A33B;
    --green: #5C8C6B;
    --rail: #454C46;
    --text-dim: #9BA39C;
    --text-bright: #F2EFE6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace;
    padding-bottom: 60px;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--rail);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0;
  }
  header p {
    color: var(--text-dim);
    font-size: 11px;
    margin: 4px 0 0;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--rail);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin: 10px 0 5px;
  }
  input[type="text"], input[type="tel"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--rail);
    color: var(--text-bright);
    border-radius: 5px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input::placeholder { color: var(--text-dim); opacity: 0.6; }
  .roles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .role-pill {
    border: 1px solid var(--rail);
    color: var(--text-dim);
    background: transparent;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
  }
  .role-pill.active {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  button.primary {
    width: 100%;
    background: var(--green);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 13px;
    margin-top: 14px;
    cursor: pointer;
  }
  button.primary.amber { background: var(--amber); }
  button.primary:active { transform: scale(0.98); }
  .staff-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--rail);
    padding: 8px 0;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-name { font-size: 14px; }
  .staff-roles {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 5px;
  }
  .staff-roles span {
    font-size: 10px;
    color: var(--text-dim);
    border: 1px solid var(--rail);
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .empty { color: var(--text-dim); font-size: 13px; }
  .ticket {
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    padding: 16px 14px 14px;
    margin-bottom: 14px;
    position: relative;
  }
  .stamp {
    position: absolute;
    top: 10px;
    right: 12px;
    border: 2px solid var(--amber);
    color: var(--amber);
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 1px 7px;
    border-radius: 3px;
    transform: rotate(-6deg);
  }
  .stamp.filled { border-color: var(--green); color: var(--green); }
  .ticket .role {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-transform: uppercase;
    padding-right: 70px;
  }
  .ticket .meta { font-size: 11px; opacity: 0.65; margin-top: 3px; }
  .ticket .note { font-size: 13px; margin-top: 8px; }
  .responder-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px dashed var(--rail);
    margin-top: 10px;
    padding-top: 8px;
  }
  .responder-row:first-of-type { border-top: 1px dashed rgba(35,38,31,0.25); }
  .assign-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
  }
  .banner {
    font-size: 12px;
    text-align: center;
    padding: 9px;
    font-weight: 600;
  }
  .banner.success { background: var(--green); color: #fff; }
  .banner.warn { background: var(--amber); color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>Open Shift Rail — Manager</h1>
  <p id="subtitle">loading…</p>
</header>

<div id="banner"></div>

<main>
  <div class="card">
    <h2>Post an open shift</h2>
    <label>Position</label>
    <select id="shiftRole"></select>
    <label>When</label>
    <input type="text" id="shiftTime" placeholder="e.g. Today, 5pm–close" />
    <label>Note (optional)</label>
    <input type="text" id="shiftNote" placeholder="e.g. Jordan called out sick" />
    <button class="primary amber" onclick="postShift()">Send to staff now</button>
  </div>

  <div class="card">
    <h2>Open shifts</h2>
    <div id="openShifts"><p class="empty">No open shifts.</p></div>
  </div>

  <div class="card">
    <h2>Recently filled</h2>
    <div id="filledShifts"><p class="empty">Nothing filled yet.</p></div>
  </div>

  <div class="card">
    <h2>Staff</h2>
    <div id="staffList"><p class="empty">No staff yet.</p></div>

    <label style="margin-top:16px">Name</label>
    <input type="text" id="staffName" placeholder="Full name" />
    <label>Phone</label>
    <input type="tel" id="staffPhone" placeholder="+15551234567" />
    <label>Role(s) — tap all that apply</label>
    <div class="roles" id="staffRoles"></div>
    <button class="primary" onclick="addStaff()">Add staff</button>
  </div>
</main>

<script>
const ROLES = ["Line Cook", "Server", "Host", "Bartender", "Busser", "Dishwasher", "Prep Cook", "Expo"];
let selectedRoles = [];
let staff = [];
let shifts = [];

const roleSelect = document.getElementById("shiftRole");
ROLES.forEach(r => {
  const opt = document.createElement("option");
  opt.value = r; opt.textContent = r;
  roleSelect.appendChild(opt);
});

const rolesDiv = document.getElementById("staffRoles");
ROLES.forEach(r => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "role-pill";
  btn.textContent = r;
  btn.onclick = () => {
    if (selectedRoles.includes(r)) {
      selectedRoles = selectedRoles.filter(x => x !== r);
      btn.classList.remove("active");
    } else {
      selectedRoles.push(r);
      btn.classList.add("active");
    }
  };
  rolesDiv.appendChild(btn);
});

function showBanner(text, tone) {
  const el = document.getElementById("banner");
  el.innerHTML = `<div class="banner ${tone}">${text}</div>`;
  setTimeout(() => { el.innerHTML = ""; }, 6000);
}

async function api(path, options) {
  try {
    const res = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    let body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) return { ok: false, error: (body && body.error) || `HTTP ${res.status}` };
    return { ok: true, data: body };
  } catch (e) {
    return { ok: false, error: "Network error — is the server running?" };
  }
}

async function loadAll() {
  const [s, sh] = await Promise.all([api("/api/staff"), api("/api/shifts")]);
  if (s.ok) staff = s.data;
  if (sh.ok) shifts = sh.data;
  render();
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m / 60)}h ago`;
}

function render() {
  document.getElementById("subtitle").textContent =
    `${shifts.filter(s => s.status === "open").length} open · ${staff.length} staff`;

  // staff list
  const staffDiv = document.getElementById("staffList");
  staffDiv.innerHTML = staff.length === 0
    ? '<p class="empty">No staff yet.</p>'
    : staff.map(p => `
        <div class="staff-row">
          <div>
            <div class="staff-name">${escapeHtml(p.name)}</div>
            <div class="staff-roles">
              ${(p.roles && p.roles.length) ? p.roles.map(r => `<span>${escapeHtml(r)}</span>`).join("") : '<span style="opacity:0.5">no role</span>'}
            </div>
          </div>
          <button class="del-btn" onclick="removeStaff('${p.id}')">✕</button>
        </div>
      `).join("");

  // open shifts
  const open = shifts.filter(s => s.status === "open");
  const openDiv = document.getElementById("openShifts");
  openDiv.innerHTML = open.length === 0
    ? '<p class="empty">No open shifts.</p>'
    : open.map(s => `
        <div class="ticket">
          <div class="stamp">Open</div>
          <div class="role">${escapeHtml(s.role)}</div>
          <div class="meta">${escapeHtml(s.time || "ASAP")} · posted ${timeAgo(s.postedAt)}</div>
          ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ""}
          ${s.responders.length === 0
            ? '<div class="meta" style="margin-top:10px">No one\'s responded yet</div>'
            : s.responders.map(r => `
                <div class="responder-row">
                  <span>${escapeHtml(r.name)} <span style="opacity:0.5;font-size:11px">· ${timeAgo(r.ts)}</span></span>
                  <button class="assign-btn" onclick="assign('${s.id}','${r.staffId}')">Assign</button>
                </div>
              `).join("")}
        </div>
      `).join("");

  // filled shifts
  const filled = shifts.filter(s => s.status === "filled").slice(0, 6);
  const filledDiv = document.getElementById("filledShifts");
  filledDiv.innerHTML = filled.length === 0
    ? '<p class="empty">Nothing filled yet.</p>'
    : filled.map(s => {
        const assignee = staff.find(p => p.id === s.assignedTo);
        return `
          <div class="ticket">
            <div class="stamp filled">Filled</div>
            <div class="role">${escapeHtml(s.role)}</div>
            <div class="meta">${escapeHtml(s.time || "ASAP")}</div>
            <div class="note">Covered by ${assignee ? escapeHtml(assignee.name) : "someone"}</div>
          </div>
        `;
      }).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

async function addStaff() {
  const name = document.getElementById("staffName").value.trim();
  const phone = document.getElementById("staffPhone").value.trim();
  if (!name) return showBanner("Enter a name first", "warn");
  if (!phone) return showBanner("Enter a phone number first", "warn");
  const result = await api("/api/staff", {
    method: "POST",
    body: JSON.stringify({ name, phone, roles: selectedRoles }),
  });
  if (result.ok) {
    showBanner(`Added ${name}`, "success");
    document.getElementById("staffName").value = "";
    document.getElementById("staffPhone").value = "";
    selectedRoles = [];
    document.querySelectorAll(".role-pill").forEach(b => b.classList.remove("active"));
    loadAll();
  } else {
    showBanner(result.error, "warn");
  }
}

async function removeStaff(id) {
  await api(`/api/staff/${id}`, { method: "DELETE" });
  loadAll();
}

async function postShift() {
  const role = document.getElementById("shiftRole").value;
  const time = document.getElementById("shiftTime").value.trim();
  const note = document.getElementById("shiftNote").value.trim();
  const result = await api("/api/shifts", {
    method: "POST",
    body: JSON.stringify({ role, time, note }),
  });
  if (result.ok) {
    const sms = result.data.sms || { sent: 0, total: 0 };
    showBanner(
      sms.total ? `Texted ${sms.sent}/${sms.total} ${role}s` : `Posted — no staff on file for ${role}`,
      sms.sent > 0 ? "success" : "warn"
    );
    document.getElementById("shiftTime").value = "";
    document.getElementById("shiftNote").value = "";
    loadAll();
  } else {
    showBanner(result.error, "warn");
  }
}

async function assign(shiftId, staffId) {
  const result = await api(`/api/shifts/${shiftId}/assign`, {
    method: "POST",
    body: JSON.stringify({ staffId }),
  });
  if (result.ok) {
    showBanner("Assigned — confirmation text sent", "success");
    loadAll();
  } else {
    showBanner(result.error, "warn");
  }
}

loadAll();
setInterval(loadAll, 5000);
</script>
</body>
</html>
